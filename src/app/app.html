<div class="app-shell">
  <!-- Navigation Header -->
  <app-header
    (openCreateMemory)="openCreateMemory()"
    (openCategoryModal)="showCategoryModal.set(true)"
    (openAuthModal)="showAuthModal.set(true)"
    (openSupabaseConfig)="showSupabaseModal.set(true)"
  ></app-header>

  <!-- Notification Banner / Toast -->
  @if (toastMessage(); as msg) {
    <div class="toast-notification">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
      <span>{{ msg }}</span>
    </div>
  }

  <!-- Main Content Area -->
  <main class="container main-content">
    <!-- Intro / Headline: "Your memories" -->
    <div class="intro-headline">
      <h1 class="intro-title">Your memories</h1>
    </div>

    <!-- Stats Banner: memories this year, total, categories, mood -->
    <app-stats></app-stats>

    <!-- Filter & Search Bar: Free text, Category chips, Mood filter, Sort -->
    <app-filters
      [filters]="filters()"
      (filtersChange)="filters.set($event)"
      (openAddCategory)="showCategoryModal.set(true)"
    ></app-filters>

    <!-- Month-to-Month Timeline View -->
    <app-timeline
      [monthGroups]="monthGroups()"
      (editMemory)="onEditMemory($event)"
      (deleteMemory)="onDeleteMemory($event)"
      (openCreateMemory)="openCreateMemory()"
      (openImage)="activeLightboxImage.set($event)"
    ></app-timeline>
  </main>

  <!-- Modals -->

  <!-- 1. Log / Edit Memory Modal -->
  @if (showMemoryModal()) {
    <app-memory-modal
      [memoryToEdit]="memoryToEdit()"
      (close)="showMemoryModal.set(false)"
      (saved)="onMemorySaved()"
      (openCategoryModal)="showCategoryModal.set(true)"
    ></app-memory-modal>
  }

  <!-- 2. Category Management Modal -->
  @if (showCategoryModal()) {
    <app-category-modal
      (close)="showCategoryModal.set(false)"
    ></app-category-modal>
  }

  <!-- 3. Auth Modal (Sign In & Sign Up with Supabase) -->
  @if (showAuthModal()) {
    <app-auth-modal
      (close)="showAuthModal.set(false)"
    ></app-auth-modal>
  }

  <!-- 4. Supabase Credentials Modal -->
  @if (showSupabaseModal()) {
    <app-supabase-modal
      (close)="showSupabaseModal.set(false)"
    ></app-supabase-modal>
  }

  <!-- 5. Fullscreen Image Lightbox -->
  @if (activeLightboxImage(); as imgUrl) {
    <app-image-lightbox
      [imageUrl]="imgUrl"
      (close)="activeLightboxImage.set(null)"
    ></app-image-lightbox>
  }
</div>
